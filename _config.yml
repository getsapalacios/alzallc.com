# Jekyll settings for alzallc.com (GitHub Pages builds this automatically).
title: Alza Services
url: "https://alzallc.com"
permalink: /blog/:title/
markdown: kramdown
kramdown:
  input: GFM

# Posts dated in the future stay hidden until that date (see .github/workflows/daily-rebuild.yml).
future: false

plugins:
  - jekyll-sitemap

# Posts with `published: false` in their header are never built.
# Files here are not part of the live site.
exclude:
  - CLAUDE.md
  - "*.bak-*"
  - VERSION
  - README.md
  - BLOG.md
  - demo
  - sprint-2026-3
  - .github
