---
layout: default
---
<article class="content">
  <p class="meta">{{ page.date | date: "%B %-d, %Y" }}</p>
  {% if page.image.path %}<img class="post-hero" src="{{ page.image.path | relative_url }}" alt="{{ page.image.alt | escape }}" width="1200" height="630" />{% endif %}
  {{ content }}
</article>
